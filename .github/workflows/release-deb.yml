name: Build and release .deb

# One universal .deb for Debian / Ubuntu / Linux Mint (amd64).
# Built with PyInstaller on Ubuntu 22.04 so it runs on Mint 21/22 and newer Ubuntu/Debian.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-deb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        timeout-minutes: 8
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            echo "apt attempt ${attempt}/3"
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get update -qq \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 && \
            sudo apt-get install -y -qq --no-install-recommends \
              python3 python3-venv python3-pip dpkg-dev binutils \
              fonts-liberation fonts-urw-base35 file && break
            echo "apt failed, retrying in 15s..."
            sleep 15
          done

      - name: Set version
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building universal ${VERSION}"

      - name: Build universal .deb
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh --local
          ls -lh dist/*.deb

      - name: Smoke test binary
        run: |
          ./dist/pyi/pdf-sign-verifier/pdf-sign-verifier --list-roots | head -10
          ./dist/pyi/pdf-sign-verifier/pdf-sign-verifier --no-browser --port 18765 &
          srv=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18765/ >/dev/null && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:18765/ >/dev/null
          kill "$srv" 2>/dev/null || true
          wait "$srv" 2>/dev/null || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PDF Sign Verifier ${{ steps.ver.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: dist/pdf-sign-verifier_*.deb
          body: |
            ## One package for all company PCs

            Works on **Linux Mint XFCE**, **Ubuntu**, and **Debian** (amd64).

            ### Install
            ```bash
            cd ~/Downloads
            sudo apt install ./pdf-sign-verifier_${{ steps.ver.outputs.version }}_amd64.deb
            pdf-sign-verifier
            ```

            Or open **PDF Sign Verifier** from the application menu.

            **Commit:** `${{ github.sha }}`  
            Self-contained runtime (no system Python version required).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
