name: Build and release .deb

# One universal .deb for Debian / Ubuntu / Linux Mint (amd64).
# Built with PyInstaller on Ubuntu 22.04 so it runs on Mint 21/22 and newer Ubuntu/Debian.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y -qq --no-install-recommends \
            python3 python3-venv python3-pip dpkg-dev binutils \
            fonts-liberation fonts-urw-base35 file \
            gir1.2-gtk-3.0 libgtk-3-0 \
            gir1.2-webkit2-4.0 libwebkit2gtk-4.0-37

      - name: Set version
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building universal ${VERSION}"

      - name: Build universal .deb
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh --local
          ls -lh dist/*.deb

      - name: Smoke test binary
        run: |
          ./dist/pyi/pdf-sign-verifier/pdf-sign-verifier --list-roots | head -10

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PDF Sign Verifier ${{ steps.ver.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: dist/pdf-sign-verifier_*.deb
          body: |
            ## One package for all company PCs

            Works on **Linux Mint XFCE**, **Ubuntu**, and **Debian** (amd64).

            ### Install
            ```bash
            cd ~/Downloads
            sudo apt install ./pdf-sign-verifier_${{ steps.ver.outputs.version }}_amd64.deb
            pdf-sign-verifier
            ```

            Or open **PDF Sign Verifier** from the application menu.

            **Commit:** `${{ github.sha }}`  
            Self-contained runtime (no system Python version required).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
