name: Build and release .deb

# Every push to main builds .deb packages for Linux Mint XFCE company PCs:
#   - Mint 22.x  (Ubuntu 24.04 / Python 3.12)
#   - Mint 21.x  (Ubuntu 22.04 / Python 3.10)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: mint22
            label: "Linux Mint 22.x XFCE (Ubuntu 24.04 / Python 3.12)"
          - os: ubuntu-22.04
            suffix: mint21
            label: "Linux Mint 21.x XFCE (Ubuntu 22.04 / Python 3.10)"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-venv python3-pip dpkg-dev binutils \
            fonts-liberation fonts-urw-base35

      - name: Set version
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} for ${{ matrix.suffix }}"

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEB_SUFFIX: ${{ matrix.suffix }}
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh
          ls -lh dist/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.suffix }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true

      - name: List packages
        run: ls -lh artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PDF Sign Verifier 1.0.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: artifacts/*.deb
          body: |
            ## For Linux Mint XFCE (company PCs)

            Download the matching package from this release:

            | Your PC | Download file |
            |---------| | ------------- |
            | **Linux Mint 22 / 22.1 / 22.2 / 22.3 XFCE** | `pdf-sign-verifier_1.0.${{ github.run_number }}_amd64_mint22.deb` |
            | **Linux Mint 21 / 21.1 / 21.2 / 21.3 XFCE** | `pdf-sign-verifier_1.0.${{ github.run_number }}_amd64_mint21.deb` |

            ### Install
            ```bash
            sudo apt install ./pdf-sign-verifier_*.deb
            pdf-sign-verifier
            ```
            Or open **PDF Sign Verifier** from the XFCE menu (Office / Accessories).

            Check your Mint version: Menu → System Info, or run `cat /etc/linuxmint/info`

            **Commit:** `${{ github.sha }}`  
            Auto-built from `main` — every push publishes a new release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
