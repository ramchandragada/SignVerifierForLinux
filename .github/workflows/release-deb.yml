name: Build and release .deb

# Every push to main builds .deb packages for:
#   - Mint 22.x  (Ubuntu 24.04 / Python 3.12)
#   - Mint 21.x  (Ubuntu 22.04 / Python 3.10)
#   - Ubuntu 26.04 (Python 3.14) — developer / newer PCs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: mint22
          - os: ubuntu-22.04
            suffix: mint21
          - os: ubuntu-24.04
            suffix: ubuntu26
            docker_image: ubuntu:26.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (native)
        if: ${{ !matrix.docker_image }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-venv python3-pip dpkg-dev binutils \
            fonts-liberation fonts-urw-base35

      - name: Set version
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} for ${{ matrix.suffix }}"

      - name: Build .deb (native)
        if: ${{ !matrix.docker_image }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEB_SUFFIX: ${{ matrix.suffix }}
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh
          ls -lh dist/*.deb

      - name: Build .deb (Docker)
        if: ${{ matrix.docker_image }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEB_SUFFIX: ${{ matrix.suffix }}
        run: |
          chmod +x packaging/build-deb.sh
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/dist:/out" \
            -e VERSION \
            -e DEB_SUFFIX \
            "${{ matrix.docker_image }}" \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq python3 python3-venv python3-pip dpkg-dev binutils \
                fonts-liberation fonts-urw-base35 >/dev/null
              cp -a /src /build
              cd /build
              mkdir -p /build/dist
              bash /build/packaging/build-deb.sh
              cp -a /build/dist/*.deb /out/
            '
          ls -lh dist/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.suffix }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true

      - name: List packages
        run: ls -lh artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PDF Sign Verifier 1.0.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: artifacts/*.deb
          body: |
            ## Pick the package for your PC

            | Your PC | Download |
            |---------|----------|
            | **Linux Mint 22.x XFCE** | `pdf-sign-verifier_1.0.${{ github.run_number }}_amd64_mint22.deb` |
            | **Linux Mint 21.x XFCE** | `pdf-sign-verifier_1.0.${{ github.run_number }}_amd64_mint21.deb` |
            | **Ubuntu 26.04** | `pdf-sign-verifier_1.0.${{ github.run_number }}_amd64_ubuntu26.deb` |

            ### Install (exact filename — do not use `*` until the file is in the current folder)
            ```bash
            cd ~/Downloads
            sudo apt install ./pdf-sign-verifier_1.0.${{ github.run_number }}_amd64_ubuntu26.deb
            pdf-sign-verifier
            ```

            Check your system: `cat /etc/os-release` or on Mint `cat /etc/linuxmint/info`

            **Commit:** `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
