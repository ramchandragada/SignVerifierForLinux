name: Build and release .deb

# Every push to main (and manual runs) builds a fresh .deb and publishes
# it to GitHub Releases so company users can download the latest package.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-venv python3-pip dpkg-dev binutils \
            fonts-liberation fonts-urw-base35

      - name: Set version
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh
          ls -lh dist/*.deb

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PDF Sign Verifier ${{ steps.ver.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/pdf-sign-verifier_*.deb
          body: |
            ## Install (Ubuntu 24.04 amd64)

            1. Download `pdf-sign-verifier_${{ steps.ver.outputs.version }}_amd64.deb`
            2. Install:
               ```bash
               sudo apt install ./pdf-sign-verifier_${{ steps.ver.outputs.version }}_amd64.deb
               pdf-sign-verifier
               ```

            **Commit:** `${{ github.sha }}`  
            **Auto-built** from `main` — every push publishes a new release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
